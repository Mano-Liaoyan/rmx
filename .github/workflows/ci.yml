name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Formatting, with the stable rustfmt and the options in rustfmt.toml.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check

  # Lints and every test that needs no container, on the platform the tests are written for.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype-dev libssl-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The bench build compiles code a normal build leaves out.
      - run: cargo clippy --workspace --all-targets --locked --features rmx-app/bench -- -D warnings
      - run: cargo test --workspace --locked

  # That the application still compiles and links elsewhere.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # After the cache: restoring target/ would drop the libcrypto.lib this puts in it.
      - name: Prebuilt OpenSSL
        if: runner.os == 'Windows'
        run: ./packaging/windows/openssl.ps1
      - run: cargo build --locked -p rmx-app
