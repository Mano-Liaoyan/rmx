[package]
name = "rmx-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
data-encoding = "2"
hmac = "0.13"
log = "0.4"
# `ring` instead of the default aws-lc-rs: the project ships one crypto stack.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
sha1 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
