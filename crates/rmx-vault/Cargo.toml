[package]
name = "rmx-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KeePass-style encrypted connection database with row-level sync"

[features]
default = ["bundled-sqlcipher"]
# Compile SQLCipher from source and link the system libcrypto (needs libopenssl-devel).
bundled-sqlcipher = ["rusqlite/bundled-sqlcipher"]
# Additionally compile and statically link OpenSSL (for machines without its headers).
vendored-openssl = ["bundled-sqlcipher", "rusqlite/bundled-sqlcipher-vendored-openssl"]
# Quick unlock through the desktop's Secret Service.
keyring = ["dep:keyring"]

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", default-features = false }
log = { version = "0.4", default-features = false }
ring = { version = "0.17", default-features = false }
rusqlite = { version = "0.41", default-features = false }
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto"] }
thiserror = { version = "2", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = { version = "2", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "v4", "v8"] }
zeroize = { version = "1", default-features = false, features = ["alloc", "zeroize_derive"] }
keyring = { version = "3", default-features = false, optional = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
