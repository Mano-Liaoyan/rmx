[package]
name = "rmx-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = { version = "0.37", default-features = false }
egui_glow = { version = "0.37", default-features = false }
libc = "0.2"
log = "0.4"
rmx-layout = { path = "../rmx-layout" }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[dev-dependencies]
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wayland", "x11", "glx", "wgl"] }
