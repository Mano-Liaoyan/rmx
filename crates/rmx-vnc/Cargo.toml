[package]
name = "rmx-vnc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
log = { version = "0.4", default-features = false }
rmx-display = { path = "../rmx-display" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
vnc-rs = { version = "0.6", default-features = false }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
