[package]
name = "rmx-rdp"
version.workspace = true
edition.workspace = true
license.workspace = true

# These are the crates behind `ironrdp` 0.17, one release line newer than that meta crate pins:
# `ironrdp` 0.17 requires `ironrdp-connector` 0.10, whose `picky =7.0.0-rc.25` pins
# `curve25519-dalek =5.0.0-rc.1`, which cannot resolve alongside russh 0.65's `curve25519-dalek ^5`.
[dependencies]
rmx-display = { path = "../rmx-display" }

ironrdp-cliprdr = "0.9"
ironrdp-connector = "0.12"
ironrdp-core = { version = "0.3", features = ["std"] }
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-pdu = { version = "0.11", features = ["std"] }
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
ironrdp-tokio = "0.12"

log = "0.4"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "process", "rt-multi-thread"] }
